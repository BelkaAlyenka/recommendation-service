spring.application.name=recommendation

spring.datasource.url=jdbc:h2:file:./transaction
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.read-only=true

spring.rules.datasource.jdbc-url=jdbc:postgresql://localhost:5432/recommendation_rules
spring.rules.datasource.username=postgres
spring.rules.datasource.password=postgres
spring.rules.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=false