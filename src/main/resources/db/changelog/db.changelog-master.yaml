databaseChangeLog:
  - changeSet:
      id: 20260905-01
      author: student
      changes:
        - createTable:
            tableName: recommendation_rules
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: product_text
                  type: TEXT
                  constraints:
                    nullable: false

        - createTable:
            tableName: rule_queries
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: rule_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_query_rule
                    referencedTableName: recommendation_rules
                    referencedColumnNames: id
                    deleteCascade: true
              - column:
                  name: query_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: negate
                  type: BOOLEAN
                  constraints:
                    nullable: false

        - createTable:
            tableName: query_arguments
            columns:
              - column:
                  name: query_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_argument_query
                    referencedTableName: rule_queries
                    referencedColumnNames: id
                    deleteCascade: true
              - column:
                  name: argument
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: argument_order
                  type: INT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: query_arguments
            columnNames: query_id, argument_order
            constraintName: pk_query_arguments